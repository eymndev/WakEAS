name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS Simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: |
          xcodebuild -version
          xcodebuild -project WakEAS.xcodeproj -scheme WakEAS \
            -destination 'generic/platform=${{ matrix.platform }}' \
            CODE_SIGNING_ALLOWED=NO \
            build
